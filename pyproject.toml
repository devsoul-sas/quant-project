[project]
name = "devsoul-quant"
version = "0.1.0"
description = "Local-first, demo-only quantitative research core"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.12,<3",
]

[project.scripts]
devsoul-quant = "devsoul_quant.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=1.19,<2",
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
    "ruff>=0.15,<0.16",
]

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--cov=devsoul_quant",
    "--cov-report=term-missing:skip-covered",
    "--cov-fail-under=95",
]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["devsoul_quant"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
pretty = true
show_error_codes = true
mypy_path = "src"
packages = ["devsoul_quant"]
